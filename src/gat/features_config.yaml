# Feature Configuration for GAT + Spectral Clustering
# This file defines which building attributes are used in different stages

# GAT Features (used during training for classification)
# These features are selected for their discriminative power in predicting building labels
gat_features:
  - height      # Building height (meters)
  - albedo      # Surface albedo (reflectivity)
  - hwratio     # Height-to-width ratio
  - density     # Building density metric
  # Note: 'degree' (number of neighbors) is added automatically during graph construction

# Clustering Features (used during spectral clustering for spatial grouping)
# These features capture morphological similarity for spatial cluster formation
clustering_features:
  - height       # Building height (meters)
  - area         # Building footprint area (square meters)
  - perimeter    # Building perimeter (meters)
  - orientation  # Main axis orientation (degrees)
  - elongation   # Elongation measure
  - concavity    # Concavity measure
  - circularity  # Circularity measure
  - radius       # Distance from center (meters)
  - factality    # Fractal dimension
  - overlap      # Overlap metric
  - shape        # Shape metric
  - density      # Building density
  # Note: 'degree' (number of neighbors) can be added during clustering if needed

# Feature Descriptions and Usage
feature_descriptions:
  height: "Building height - used in both GAT and clustering"
  albedo: "Surface albedo/reflectivity - GAT only (discriminative)"
  hwratio: "Height-to-width ratio - GAT only (discriminative)"
  area: "Building footprint area - clustering only (morphological)"
  perimeter: "Building perimeter - clustering only (morphological)"
  orientation: "Main axis orientation - clustering only (morphological)"
  elongation: "Elongation measure - clustering only (morphological)"
  concavity: "Concavity measure - clustering only (morphological)"
  circularity: "Circularity measure - clustering only (morphological)"
  radius: "Distance from center - clustering only (spatial)"
  factality: "Fractal dimension - clustering only (morphological)"
  overlap: "Overlap metric - clustering only (spatial)"
  shape: "Shape metric - clustering only (morphological)"
  density: "Building density - used in both GAT and clustering"
  degree: "Number of neighboring buildings - added dynamically"

# Design Rationale:
# - GAT features: Selected for label discrimination (what type of building?)
# - Clustering features: Selected for spatial grouping (which buildings belong together?)
# - This separation allows GAT to focus on classification while spectral clustering
#   focuses on spatial smoothing based on morphological and spatial similarity

